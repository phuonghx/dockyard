name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  plasmoid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Build the .plasmoid
        run: tools/package.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Dockyard ${tag#v}" --generate-notes
          gh release upload "$tag" dist/*.plasmoid --clobber
